name: Deploy Pragya to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Lint TypeScript, React & ESM (.mjs)
        run: npm run lint

      - name: Run JS unit tests
        run: npm run test:unit

      - name: Run Python CLI unit tests
        run: python3 -m unittest discover -s tests/unit -v

      - name: Verify CLI and skill bundle are byte-identical
        run: npm run check:skill

      - name: Check optional build-time OAuth Client ID
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "${VITE_GOOGLE_CLIENT_ID}" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID secret is empty — users will see the inline Client ID setup guide until configured."
          fi

      - name: Build production bundle
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_BASE_PATH: '/pragya/'
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
