name: CI & Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Lint TypeScript, React & ESM (.mjs)
        run: npm run lint

      - name: Run JS/TS unit & parity tests
        run: npm run test:unit

      - name: Run Python CLI unit tests
        run: python3 -m unittest discover -s tests/unit -v

      - name: Verify CLI and skill bundle are byte-identical
        run: npm run check:skill

      - name: Build default production bundle
        run: npm run build

      - name: Build GitHub Pages (/pragya/) production bundle
        env:
          VITE_BASE_PATH: '/pragya/'
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite (incl. prod SW /pragya/ spec)
        run: npm run test:e2e

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
